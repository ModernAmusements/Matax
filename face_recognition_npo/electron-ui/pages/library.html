<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library - MANTAX</title>
    <link rel="stylesheet" href="/styles/mantax-design-system.css">
    <style>
        body {
            background: var(--color-bg-light);
            font-family: var(--font-family);
            min-height: 100vh;
        }

        .thumbs {
            display: flex;
            gap: var(--space-2);
            flex-wrap: wrap;
            margin-top: var(--space-3);
        }

        .thumb {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb button {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            background: var(--color-error);
            color: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: var(--space-4);
            max-width: 600px;
            margin: 0 auto;
        }

        .person-card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            text-align: center;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .person-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-xl);
        }

        .person-thumb {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            margin: 0 auto var(--space-2);
            overflow: hidden;
            background: var(--color-bg-light);
        }

        .person-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .person-name {
            font-weight: 600;
            color: var(--color-label);
        }

        .person-count {
            font-size: var(--font-size-sm);
            color: var(--color-label-secondary);
        }

        .empty {
            text-align: center;
            color: var(--color-label-muted);
            padding: var(--space-10);
        }

        .back {
            position: fixed;
            bottom: var(--space-6);
            left: var(--space-6);
            color: var(--color-label-secondary);
            background: none;
            border: none;
            cursor: pointer;
            font-size: var(--font-size-sm);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header text-center">
            <h1 style="font-size:var(--font-size-2xl);color:var(--color-label);margin-bottom:var(--space-2)">Library</h1>
            <p style="color:var(--color-label-secondary)">Manage reference persons</p>
        </div>

        <div class="card" style="max-width:500px;margin:0 auto var(--space-5)">
            <input type="text" id="personName" class="form-input" placeholder="Enter person's name" style="margin-bottom:var(--space-3)">
            <button class="button-liquid-glass" onclick="clickInput()" style="margin-bottom:var(--space-3)">
                <div class="BG"></div>
                <div class="glass-effect"></div>
                <div class="text">+ Add Images</div>
            </button>
            <input type="file" id="imgInput" accept="image/*" multiple onchange="handleImgs(event)" style="display:none">
            <div class="thumbs" id="thumbs"></div>
            <button class="button-liquid-glass success" onclick="savePerson()" id="saveBtn" disabled style="width:100%;margin-top:var(--space-3)">
                <div class="BG"></div>
                <div class="glass-effect"></div>
                <div class="text">Save Person</div>
            </button>
        </div>

        <div style="max-width:500px;margin:0 auto var(--space-5)">
            <input type="text" id="search" class="form-input" placeholder="Search by name..." onkeyup="filter()">
        </div>

        <div class="grid" id="grid">
            <p class="empty">No persons in library</p>
        </div>
    </div>

    <button class="back" onclick="go('dashboard.html')">← Back to Dashboard</button>

    <script>
        const API = 'http://localhost:3000/api';
        let persons = [], imgs = [];

        function go(p) { location.href = p; }
        function clickInput() { document.getElementById('imgInput').click(); }

        function handleImgs(e) {
            Array.from(e.target.files).forEach(f => {
                const r = new FileReader();
                r.onload = ev => { imgs.push(ev.target.result); render(); };
                r.readAsDataURL(f);
            });
        }

        function render() {
            const c = document.getElementById('thumbs');
            c.innerHTML = imgs.map((s, i) => '<div class="thumb"><img src="' + s + '"><button onclick="rm(' + i + ')">×</button></div>').join('');
            check();
        }

        function rm(i) { imgs.splice(i, 1); render(); }
        function check() { document.getElementById('saveBtn').disabled = !(document.getElementById('personName').value.trim() && imgs.length); }
        document.getElementById('personName').addEventListener('input', check);

        async function load() {
            try {
                const res = await fetch(API + '/references');
                const data = await res.json();
                if (data.success) persons = data.references || [];
                renderPersons();
            } catch(e) {}
        }

        function renderPersons(f) {
            const g = document.getElementById('grid');
            const list = f || persons;
            if (!list.length) { g.innerHTML = '<p class="empty">No persons in library</p>'; return; }
            const grouped = {};
            list.forEach(p => { const n = p.name || 'Unknown'; if (!grouped[n]) grouped[n] = []; grouped[n].push(p); });
            g.innerHTML = Object.entries(grouped).map(([n, rs]) =>
                '<div class="person-card" onclick="select(\'' + n + '\')">' +
                    '<div class="person-thumb"><img src="' + (rs[0].thumbnail || rs[0].image || '') + '"></div>' +
                    '<div class="person-name">' + n + '</div>' +
                    '<div class="person-count">' + rs.length + ' images</div>' +
                '</div>'
            ).join('');
        }

        function filter() {
            const q = document.getElementById('search').value.toLowerCase();
            renderPersons(q ? persons.filter(p => (p.name || '').toLowerCase().includes(q)) : null);
        }

        async function savePerson() {
            const name = document.getElementById('personName').value.trim();
            if (!name || !imgs.length) return;
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.textContent = 'Saving...';
            for (const src of imgs) {
                await fetch(API + '/add-reference', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name, image: src.split(',')[1]}) });
            }
            alert('Added ' + imgs.length + ' for ' + name);
            imgs = []; document.getElementById('personName').value = ''; document.getElementById('thumbs').innerHTML = ''; load();
            btn.disabled = false; btn.textContent = 'Save Person';
        }

        function select(name) {
            let sel = MantaxSessionState.get('selected_refs') || [];
            persons.filter(p => p.name === name).forEach(r => { if (!sel.find(x => x.id === r.id)) sel.push(r); });
            MantaxSessionState.set('selected_refs', sel);
            alert('Added ' + name);
        }

        load();
    </script>
</body>

</html>
