<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANTAX - Library</title>
    <link rel="stylesheet" href="/styles/design-system.css">
    <script src="./shared-session.js"></script>
</head>

<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="sidebar-header">
                <span class="sidebar-title">MANTAX</span>
            </div>
            <div class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-link">
                    <img src="/styles/sf_icons/house.fill.svg" class="nav-icon">
                    <span>Dashboard</span>
                </a>
                <a href="analyze.html" class="sidebar-link">
                    <img src="/styles/sf_icons/person.fill.svg" class="nav-icon">
                    <span>Analyze</span>
                </a>
                <a href="library.html" class="sidebar-link active">
                    <img src="/styles/sf_icons/person.2.fill.svg" class="nav-icon">
                    <span>Library</span>
                </a>
                <a href="compare.html" class="sidebar-link">
                    <img src="/styles/sf_icons/arrow.left.arrow.right.svg" class="nav-icon">
                    <span>Compare</span>
                </a>
                <a href="results.html" class="sidebar-link">
                    <img src="/styles/sf_icons/list.number.svg" class="nav-icon">
                    <span>Results</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <small>Session Storage (auto-clear)</small>
            </div>
        </div>
    </div>

    <div class="titlebar" id="titlebar">
        <div class="titlebar-left">
            <div class="traffic-lights">
                <div class="light close" onclick="closeWindow()" title="Close"></div>
                <div class="light minimize" onclick="minimizeWindow()" title="Minimize"></div>
                <div class="light maximize" onclick="maximizeWindow()" title="Maximize"></div>
            </div>
            <button class="sidebar-toggle-icon" onclick="toggleSidebar()">
                <img src="/styles/sf_icons/sidebar.left.svg" alt="">
            </button>
        </div>
        <div class="titlebar-center">
            <span class="titlebar-title">MANTAX - Library (Session)</span>
        </div>
        <div class="titlebar-right">
            <button class="menu-icon">
                <img src="/styles/sf_icons/ellipsis.svg" alt="Menu">
            </button>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>Reference Library</h1>
            <p class="subtitle">Manage persons and their reference images</p>
        </div>

        <div class="add-person-section">
            <div class="add-person-card">
                <h3>Add New Person</h3>
                <div class="add-person-form">
                    <input type="text" id="personName" placeholder="Enter person's name" class="form-input">
                    <div class="add-images-btns">
                        <button class="btn btn-primary" onclick="document.getElementById('personImagesInput').click()">+ Add Images</button>
                        <input type="file" id="personImagesInput" accept="image/*" multiple onchange="handlePersonImages(event)" style="display:none">
                    </div>
                    <div class="selected-images" id="selectedImages"></div>
                    <button class="btn btn-success" onclick="savePerson()" id="savePersonBtn" disabled>Save Person</button>
                </div>
            </div>
        </div>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search by name..." onkeyup="filterPersons()" class="form-input search-input">
            <span class="person-count" id="personCountDisplay"></span>
        </div>

        <div class="persons-grid" id="personsGrid">
            <div class="empty-state">No persons in library.</div>
        </div>
    </div>

    <div id="toast" class="toast" style="display: none;"></div>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        let persons = [];
        let selectedImages = [];

        async function loadPersons() {
            try {
                const response = await fetch(`${API_BASE}/references`);
                const data = await response.json();
                if (data.success && data.references) {
                    persons = data.references;
                    renderPersons();
                }
            } catch (e) {
                showToast('Failed to load persons: ' + e.message, 'error');
            }
        }

        function renderPersons(filtered = null) {
            const grid = document.getElementById('personsGrid');
            const displayCount = document.getElementById('personCountDisplay');
            const list = filtered || persons;

            displayCount.textContent = `${list.length} person(s)`;

            if (list.length === 0) {
                grid.innerHTML = '<div class="empty-state">No persons found.</div>';
                return;
            }

            const grouped = {};
            list.forEach(ref => {
                const name = ref.name || 'Unknown';
                if (!grouped[name]) grouped[name] = [];
                grouped[name].push(ref);
            });

            let html = '';
            for (const [name, refs] of Object.entries(grouped)) {
                const thumb = refs[0].thumbnail || refs[0].image;
                html += `
                    <div class="person-card">
                        <div class="person-thumb"><img src="${thumb || '/styles/sf_icons/person.fill.svg'}" alt="${name}"></div>
                        <div class="person-info">
                            <div class="person-name">${name}</div>
                            <div class="person-refs">${refs.length} image(s)</div>
                        </div>
                        <button class="btn-select" onclick="selectForCompare('${name}')">Select</button>
                    </div>
                `;
            }

            grid.innerHTML = html;
        }

        function filterPersons() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = persons.filter(p => (p.name || '').toLowerCase().includes(query));
            renderPersons(filtered);
        }

        function handlePersonImages(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    selectedImages.push(e.target.result);
                    updateSelectedImagesDisplay();
                };
                reader.readAsDataURL(file);
            });
        }

        function updateSelectedImagesDisplay() {
            const container = document.getElementById('selectedImages');
            const saveBtn = document.getElementById('savePersonBtn');
            
            if (selectedImages.length === 0) {
                container.innerHTML = '';
                saveBtn.disabled = true;
                return;
            }

            let html = `<p>${selectedImages.length} image(s) selected:</p><div class="thumbnails">`;
            selectedImages.forEach((img, i) => {
                html += `<div class="thumb"><img src="${img}" alt=""><button onclick="removeImage(${i})">&times;</button></div>`;
            });
            html += '</div>';
            
            container.innerHTML = html;
            saveBtn.disabled = document.getElementById('personName').value.trim() === '';
        }

        function removeImage(index) {
            selectedImages.splice(index, 1);
            updateSelectedImagesDisplay();
        }

        async function savePerson() {
            const name = document.getElementById('personName').value.trim();
            if (!name) { showToast('Please enter a name', 'error'); return; }
            if (selectedImages.length === 0) { showToast('Please add at least one image', 'error'); return; }

            const btn = document.getElementById('savePersonBtn');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            try {
                for (const img of selectedImages) {
                    const base64 = extractBase64(img);
                    const response = await fetch(`${API_BASE}/add-reference`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name, image: base64 })
                    });
                    const data = await response.json();
                    if (!data.success) throw new Error(data.error || 'Failed to add reference');
                }

                showToast(`Added ${selectedImages.length} image(s) for ${name}`, 'success');
                selectedImages = [];
                document.getElementById('personName').value = '';
                document.getElementById('selectedImages').innerHTML = '';
                loadPersons();
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Person';
            }
        }

        function selectForCompare(name) {
            const refs = persons.filter(p => p.name === name);
            let selected = MantaxSessionState.get(MantaxSessionState.KEYS.SELECTED_REFERENCES) || [];
            
            refs.forEach(ref => {
                if (!selected.find(r => r.id === ref.id)) {
                    selected.push(ref);
                }
            });
            
            MantaxSessionState.set(MantaxSessionState.KEYS.SELECTED_REFERENCES, selected);
            showToast(`Added ${name} to session`, 'success');
        }

        document.getElementById('personName').addEventListener('input', () => {
            const saveBtn = document.getElementById('savePersonBtn');
            saveBtn.disabled = document.getElementById('personName').value.trim() === '' || selectedImages.length === 0;
        });

        function closeWindow() {
            if (window.electronAPI && window.electronAPI.close) window.electronAPI.close();
            else window.close();
        }
        function minimizeWindow() {
            if (window.electronAPI && window.electronAPI.minimize) window.electronAPI.minimize();
        }
        function maximizeWindow() {
            if (window.electronAPI && window.electronAPI.maximize) window.electronAPI.maximize();
        }
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.querySelector('.container').classList.toggle('sidebar-open');
        }

        document.addEventListener('DOMContentLoaded', loadPersons);
    </script>

    <style>
        .page-header { text-align: center; padding: 30px 20px 20px; }
        .page-header h1 { margin: 0 0 8px; font-size: 2rem; }
        .subtitle { color: var(--text-secondary); margin: 0; }

        .add-person-section { padding: 20px; max-width: 800px; margin: 0 auto; }
        .add-person-card { background: var(--surface-primary); border-radius: 16px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .add-person-card h3 { margin: 0 0 16px; }
        
        .add-person-form { display: flex; flex-direction: column; gap: 12px; }
        .form-input { padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; }
        .add-images-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        
        .selected-images { margin-top: 12px; }
        .selected-images p { margin: 0 0 8px; font-size: 0.875rem; color: var(--text-secondary); }
        .thumbnails { display: flex; gap: 8px; flex-wrap: wrap; }
        .thumb { position: relative; width: 80px; height: 80px; border-radius: 8px; overflow: hidden; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .thumb button { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border: none; border-radius: 50%; background: rgba(255,59,48,0.8); color: white; cursor: pointer; }

        .search-section { padding: 20px; max-width: 800px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
        .search-input { flex: 1; }
        .person-count { color: var(--text-secondary); white-space: nowrap; }

        .persons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; padding: 20px; max-width: 1000px; margin: 0 auto 40px; }

        .person-card { background: var(--surface-primary); border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .person-thumb { width: 80px; height: 80px; margin: 0 auto 12px; border-radius: 50%; overflow: hidden; background: var(--surface-secondary); }
        .person-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .person-name { font-weight: 600; margin-bottom: 4px; }
        .person-refs { font-size: 0.875rem; color: var(--text-secondary); }
        .btn-select { margin-top: 12px; padding: 6px 16px; font-size: 0.875rem; }

        .empty-state { text-align: center; color: var(--text-secondary); padding: 40px; grid-column: 1 / -1; }
    </style>
</body>

</html>
