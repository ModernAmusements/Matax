<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - MANTAX</title>
    <link rel="stylesheet" href="/styles/mantax-design-system.css">
    <style>
        body {
            background: var(--color-bg-light);
            font-family: var(--font-family);
            min-height: 100vh;
        }

        .result-card {
            display: flex;
            align-items: center;
            padding: var(--space-4);
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .result-thumb {
            width: 50px;
            height: 50px;
            border-radius: var(--radius-md);
            margin-right: var(--space-3);
            overflow: hidden;
            background: var(--color-bg-light);
        }

        .result-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-name {
            font-weight: 600;
            color: var(--color-label);
        }

        .result-score {
            font-size: var(--font-size-sm);
            color: var(--color-label-secondary);
            margin-top: 2px;
        }

        .score-bar {
            height: 4px;
            background: var(--color-bg-light);
            border-radius: 2px;
            margin-top: var(--space-2);
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            border-radius: 2px;
        }

        .score-high { background: var(--color-success); }
        .score-medium { background: #FF9F0A; }
        .score-low { background: var(--color-error); }

        .empty {
            text-align: center;
            color: var(--color-label-muted);
            padding: var(--space-12);
        }

        .back {
            position: fixed;
            bottom: var(--space-6);
            left: var(--space-6);
            color: var(--color-label-secondary);
            background: none;
            border: none;
            cursor: pointer;
            font-size: var(--font-size-sm);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header text-center">
            <h1 style="font-size:var(--font-size-2xl);color:var(--color-label);margin-bottom:var(--space-2)">Results</h1>
            <p style="color:var(--color-label-secondary)">Comparison results</p>
        </div>

        <div class="grid" id="resultsGrid">
            <p class="empty">No comparison results yet.</p>
        </div>

        <div style="text-align:center;margin-top:var(--space-6)">
            <button class="button-liquid-glass" onclick="go()">
                <div class="BG"></div>
                <div class="glass-effect"></div>
                <div class="text">New Comparison</div>
            </button>
        </div>
    </div>

    <button class="back" onclick="go('dashboard.html')">← Back to Dashboard</button>

    <script>
        function go(p) { location.href = p || 'dashboard.html'; }

        function init() {
            const results = MantaxSessionState.get('comparison_results') || [];
            const refs = MantaxSessionState.get('compare_refs') || [];
            const grid = document.getElementById('resultsGrid');
            
            if (!results.length) {
                grid.innerHTML = '<p class="empty">No comparison results yet.</p>';
                return;
            }

            grid.style.maxWidth = '450px';
            grid.style.margin = '0 auto';
            grid.style.display = 'grid';
            grid.style.gap = 'var(--space-3)';
            
            grid.innerHTML = results.map((r, i) => {
                const score = r.similarity || 0;
                const cls = score >= 70 ? 'score-high' : score >= 45 ? 'score-medium' : 'score-low';
                const ref = refs[i];
                return '<div class="result-card">' +
                    '<div class="result-thumb">' + (ref?.image ? '<img src="' + ref.image + '">' : '') + '</div>' +
                    '<div style="flex:1">' +
                        '<div class="result-name">' + (r.name || 'Unknown') + '</div>' +
                        '<div class="result-score">' + score.toFixed(1) + '% match</div>' +
                        '<div class="score-bar"><div class="score-fill ' + cls + '" style="width:' + score + '%"></div></div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        init();
    </script>
</body>

</html>
