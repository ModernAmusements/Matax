<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare - MANTAX</title>
    <link rel="stylesheet" href="/styles/mantax-design-system.css">
    <style>
        body {
            background: var(--color-bg-light);
            font-family: var(--font-family);
            min-height: 100vh;
        }

        .query-img {
            max-width: 100%;
            max-height: 180px;
            border-radius: var(--radius-md);
        }

        .no-query {
            color: var(--color-label-muted);
            padding: var(--space-10);
        }

        .refs-info {
            padding: var(--space-3) var(--space-4);
            background: rgba(138, 96, 223, 0.1);
            border-radius: var(--radius-md);
            color: var(--color-primary);
        }

        .back {
            position: fixed;
            bottom: var(--space-6);
            left: var(--space-6);
            color: var(--color-label-secondary);
            background: none;
            border: none;
            cursor: pointer;
            font-size: var(--font-size-sm);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header text-center">
            <h1 style="font-size:var(--font-size-2xl);color:var(--color-label);margin-bottom:var(--space-2)">Compare</h1>
            <p style="color:var(--color-label-secondary)">Match query to references</p>
        </div>

        <div class="card" style="max-width:400px;margin:0 auto var(--space-4)">
            <h3 style="font-size:var(--font-size-sm);color:var(--color-label-secondary);margin-bottom:var(--space-3)">Query Image</h3>
            <div id="queryDisplay"></div>
        </div>

        <div class="card" style="max-width:400px;margin:0 auto var(--space-4)">
            <h3 style="font-size:var(--font-size-sm);color:var(--color-label-secondary);margin-bottom:var(--space-3)">Selected References</h3>
            <div class="refs-info" id="refsInfo"></div>
        </div>

        <div style="text-align:center">
            <button class="button-liquid-glass" onclick="run()" id="compareBtn" disabled style="max-width:400px;width:100%">
                <div class="BG"></div>
                <div class="glass-effect"></div>
                <div class="text">Run Comparison</div>
            </button>
            <p id="hint" style="font-size:var(--font-size-sm);color:var(--color-label-secondary);margin-top:var(--space-3)"></p>
        </div>
    </div>

    <button class="back" onclick="go('dashboard.html')">← Back to Dashboard</button>

    <script>
        function go(p) { location.href = p; }

        function init() {
            const state = MantaxSessionState.getQueryState();
            document.getElementById('queryDisplay').innerHTML = state.image ? '<img src="' + state.image + '" class="query-img">' : '<p class="no-query">No query image</p>';
            
            const refs = MantaxSessionState.get('selected_refs') || [];
            document.getElementById('refsInfo').textContent = refs.length ? refs.length + ' reference(s) selected' : 'No references';
            document.getElementById('compareBtn').disabled = !refs.length;
            document.getElementById('hint').textContent = refs.length ? 'Ready to compare with ' + refs.length + ' reference(s)' : 'Select references in Library first';
        }

        function run() { go('results.html'); }

        init();
    </script>
</body>

</html>
