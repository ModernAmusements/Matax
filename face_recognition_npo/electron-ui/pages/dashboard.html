<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MANTAX</title>
    <link rel="stylesheet" href="/styles/mantax-design-system.css">
    <style>
        body {
            background: #0a0a14;
            font-family: var(--font-family);
            min-height: 100vh;
            color: #ffffff;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 25% 25%, rgba(138, 96, 223, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(251, 93, 57, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(91, 177, 251, 0.3) 0%, transparent 55%);
            filter: blur(60px);
            animation: bgMove 15s ease-in-out infinite alternate;
        }

        @keyframes bgMove {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            max-width: 400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: var(--space-10);
        }

        .logo {
            width: 140px;
            margin-bottom: var(--space-4);
        }

        .section-title {
            font-size: var(--font-size-sm);
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            margin-bottom: var(--space-4);
        }

        .card {
            display: flex;
            align-items: center;
            padding: var(--space-5);
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-xl);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: var(--space-4);
            flex-shrink: 0;
        }

        .card-icon img {
            width: 24px;
            height: 24px;
            filter: invert(1);
        }

        .card-icon.analyze { background: #1a1a1a; }
        .card-icon.library { background: #1a1a1a; }
        .card-icon.compare { background: #1a1a1a; }

        .card h3 {
            font-size: var(--font-size-lg);
            color: #ffffff;
            margin-bottom: var(--space-1);
        }

        .card p {
            font-size: var(--font-size-sm);
            color: rgba(255, 255, 255, 0.7);
        }

        .card-arrow {
            color: rgba(255, 255, 255, 0.5);
        }

        .card-arrow img {
            width: 20px;
            height: 20px;
        }
    </style>
</head>

<body>
    <div class="main-content">
        <div class="header">
            <img src="/src/logos/Mantax_Logo_Loading.svg" class="logo">
            <h1 style="font-size:var(--font-size-2xl);color:#ffffff;margin-bottom:var(--space-2)">Welcome to MANTAX</h1>
            <p style="color:rgba(255,255,255,0.7)">Select a workflow to begin</p>
            <div class="badge" style="margin-top:var(--space-3);background:transparent;border:1px solid rgba(255,255,255,0.3);color:#fff">Session Active</div>
        </div>

        <p class="section-title">Choose Your Workflow</p>

        <div style="display:flex;flex-direction:column;gap:var(--space-4);max-width:500px;margin:0 auto">
            <div class="card" onclick="go('analyze.html')">
                <div class="card-icon analyze">
                    <img src="/styles/sf_icons/person.fill.svg">
                </div>
                <div style="flex:1">
                    <h3>Analyze</h3>
                    <p>Upload photo, detect faces & extract</p>
                </div>
                <div class="card-arrow">
                    <img src="/styles/sf_icons/chevron.right.svg">
                </div>
            </div>

            <div class="card" onclick="go('library.html')">
                <div class="card-icon library">
                    <img src="/styles/sf_icons/person.2.fill.svg">
                </div>
                <div style="flex:1">
                    <h3>Library</h3>
                    <p>Add, search & manage references</p>
                </div>
                <div class="card-arrow">
                    <img src="/styles/sf_icons/chevron.right.svg">
                </div>
            </div>

            <div class="card" onclick="go('compare.html')">
                <div class="card-icon compare">
                    <img src="/styles/sf_icons/arrow.left.arrow.right.svg">
                </div>
                <div style="flex:1">
                    <h3>Compare</h3>
                    <p>Match query & view results</p>
                </div>
                <div class="card-arrow">
                    <img src="/styles/sf_icons/chevron.right.svg">
                </div>
            </div>
        </div>

        <div style="text-align:center;margin-top:var(--space-8)">
            <button class="button-liquid-glass secondary" onclick="clearSession()">
                <div class="BG"></div>
                <div class="glass-effect"></div>
                <div class="text">Clear Session</div>
            </button>
        </div>
    </div>

    <script>
        function go(page) { location.href = page; }

        function clearSession() {
            if (confirm('Clear all session data?')) {
                MantaxSessionState.clearAll();
                alert('Session cleared');
            }
        }
    </script>
</body>

</html>
