<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyze - MANTAX</title>
    <link rel="stylesheet" href="/styles/mantax-design-system.css">
    <style>
        body {
            background: var(--color-bg-light);
            font-family: var(--font-family);
            min-height: 100vh;
        }

        .layout {
            display: flex;
            gap: var(--space-6);
            max-width: 900px;
            margin: 0 auto;
            flex-wrap: wrap;
            justify-content: center;
        }

        .upload-box {
            border: 2px dashed var(--color-label-muted);
            border-radius: var(--radius-lg);
            padding: var(--space-10);
            text-align: center;
            cursor: pointer;
            transition: border-color var(--transition-fast);
            background: var(--color-surface);
        }

        .upload-box:hover {
            border-color: var(--color-primary);
        }

        .upload-icon {
            width: 56px;
            height: 56px;
            background: rgba(138, 96, 223, 0.1);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-4);
        }

        .upload-icon img {
            width: 28px;
            height: 28px;
            filter: invert(0.4);
        }

        .action-card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
            margin-bottom: var(--space-4);
            box-shadow: var(--shadow-md);
        }

        .action-card h3 {
            font-size: var(--font-size-base);
            color: var(--color-label);
            margin-bottom: var(--space-1);
        }

        .action-card p {
            font-size: var(--font-size-sm);
            color: var(--color-label-secondary);
            margin-bottom: var(--space-3);
        }

        .result {
            margin-top: var(--space-3);
            padding: var(--space-3);
            background: rgba(52, 199, 89, 0.1);
            border-radius: var(--radius-sm);
            color: var(--color-success);
            font-size: var(--font-size-sm);
            display: none;
        }

        .result.show { display: block; }

        .back {
            position: fixed;
            bottom: var(--space-6);
            left: var(--space-6);
            color: var(--color-label-secondary);
            background: none;
            border: none;
            cursor: pointer;
            font-size: var(--font-size-sm);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header text-center">
            <h1 style="font-size:var(--font-size-2xl);color:var(--color-label);margin-bottom:var(--space-2)">Analyze</h1>
            <p style="color:var(--color-label-secondary)">Upload a photo to analyze</p>
        </div>

        <div class="layout">
            <div class="card" style="min-width:280px;max-width:350px">
                <div class="upload-box" onclick="clickInput()">
                    <div class="upload-icon">
                        <img src="/styles/sf_icons/photo.badge.plus.svg">
                    </div>
                    <p style="color:var(--color-label-secondary);margin-bottom:var(--space-4)">Click to upload or drag and drop</p>
                    <button class="button-liquid-glass">
                    <div class="BG"></div>
                    <div class="glass-effect"></div>
                    <div class="text">Choose Photo</div>
                </button>
                    <input type="file" id="imageInput" accept="image/*" onchange="handleImage(event)" style="display:none">
                </div>
            </div>

            <div class="card" style="min-width:280px;max-width:350px">
                <div class="action-card">
                    <h3>1. Detect Faces</h3>
                    <p>Find faces in the uploaded image</p>
                    <button class="button-liquid-glass" onclick="detect()" id="detectBtn" disabled>
                        <div class="BG"></div>
                        <div class="glass-effect"></div>
                        <div class="text">Find Faces</div>
                    </button>
                    <div class="result" id="detectResult"></div>
                </div>

                <div class="action-card">
                    <h3>2. Create Signature</h3>
                    <p>Extract facial embedding for comparison</p>
                    <button class="button-liquid-glass" onclick="extract()" id="extractBtn" disabled>
                        <div class="BG"></div>
                        <div class="glass-effect"></div>
                        <div class="text">Create Signature</div>
                    </button>
                    <div class="result" id="extractResult"></div>
                </div>

                <div class="action-card">
                    <h3>3. Continue</h3>
                    <p>Save to session and proceed</p>
                    <button class="button-liquid-glass success" onclick="continueTo()" id="continueBtn" disabled>
                        <div class="BG"></div>
                        <div class="glass-effect"></div>
                        <div class="text">Save & Continue</div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <button class="back" onclick="go('dashboard.html')">← Back to Dashboard</button>

    <script>
        const API = 'http://localhost:3000/api';
        let image = null;

        function go(p) { location.href = p; }
        function clickInput() { document.getElementById('imageInput').click(); }

        function handleImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = ev => {
                image = ev.target.result;
                document.getElementById('detectBtn').disabled = false;
                MantaxSessionState.set('query_image', image);
            };
            r.readAsDataURL(file);
        }

        async function detect() {
            if (!image) return;
            const btn = document.getElementById('detectBtn');
            btn.disabled = true; btn.textContent = 'Detecting...';
            try {
                const res = await fetch(API + '/detect', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({image: image.split(',')[1]})
                });
                const data = await res.json();
                if (data.success) {
                    const n = data.faces?.length || 0;
                    document.getElementById('detectResult').textContent = n + ' face(s) detected';
                    document.getElementById('detectResult').classList.add('show');
                    if (n > 0) document.getElementById('extractBtn').disabled = false;
                    MantaxSessionState.set('detected_faces', data);
                }
            } catch (e) { alert(e.message); }
            finally { btn.disabled = false; btn.textContent = 'Find Faces'; }
        }

        async function extract() {
            if (!image) return;
            const btn = document.getElementById('extractBtn');
            btn.disabled = true; btn.textContent = 'Extracting...';
            try {
                const res = await fetch(API + '/extract', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({image: image.split(',')[1]})
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('extractResult').textContent = 'Embedding extracted';
                    document.getElementById('extractResult').classList.add('show');
                    document.getElementById('continueBtn').disabled = false;
                    MantaxSessionState.set('query_embedding', data);
                }
            } catch (e) { alert(e.message); }
            finally { btn.disabled = false; btn.textContent = 'Create Signature'; }
        }

        function continueTo() { go('compare.html'); }
    </script>
</body>

</html>
